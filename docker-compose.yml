services:
  postgres:
    image: postgres:17-alpine
    container_name: himasoku-postgres
    environment:
      POSTGRES_USER: himasoku
      POSTGRES_PASSWORD: himasoku
      POSTGRES_DB: himasoku
    # ホスト側は 15432。他プロジェクトの DB が 5432 を使うため衝突を避ける。
    ports:
      - "15432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U himasoku -d himasoku"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
